<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="962" viewBox="0 0 2048 962" role="img" aria-labelledby="title desc">
  <title id="title">Computer Use plugin unavailable in Codex settings</title>
  <desc id="desc">A Codex settings page showing the Computer Use control panel with the message Computer Use plugin unavailable.</desc>
  <rect width="2048" height="962" fill="#ffffff"/>
  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
    <text x="148" y="105" font-size="44" font-weight="700" fill="#111111">电脑操控</text>
    <text x="148" y="180" font-size="34" font-weight="400" fill="#6c6c6c">管理 Codex 如何使用您电脑上的其他应用程序</text>

    <text x="148" y="360" font-size="32" font-weight="700" fill="#111111">控制</text>
    <rect x="148" y="405" width="1652" height="156" rx="22" fill="#ffffff" stroke="#e9e9e9" stroke-width="3"/>
    <text x="788" y="496" font-size="34" font-weight="400" fill="#6b6b6b">Computer Use 插件不可用</text>

    <text x="148" y="678" font-size="32" font-weight="700" fill="#111111">始终允许的应用</text>
    <rect x="148" y="726" width="1652" height="106" rx="22" fill="#ffffff" stroke="#e9e9e9" stroke-width="3"/>
    <text x="920" y="793" font-size="34" font-weight="400" fill="#6b6b6b">暂无</text>
  </g>
</svg>
